# Order-to-Audit System: PostgreSQL + the app (API and React frontend in one container).
#
#   copy .env.example .env      # then set POSTGRES_PASSWORD and JWT_SECRET_KEY
#   docker compose up --build
#   open http://localhost:8000
#
# Values come from .env. The two secrets have no defaults, so Compose refuses to start without them.
name: order-to-audit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-order_to_audit}
      POSTGRES_USER: ${POSTGRES_USER:-ota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Not published to the host. Uncomment to connect with psql or a GUI:
    # ports: ["5432:5432"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ota}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-order_to_audit}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      SEED: ${SEED:-scenario}
      SCENARIO_UNTIL: ${SCENARIO_UNTIL:-3}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo@1234}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # auto = Secure session cookie when the request came over HTTPS (via a trusted proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      # Behind a reverse proxy, set to the proxy's IP so audit logs record the real client IP.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
